<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KD Maps</title>
<link rel="manifest" href="manifest1.json">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #00ff88;
    --warning: #ffcc00;
    --danger: #ff3355;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #map {
    flex: 1;
    width: 100%;
    position: relative;
    background: #0d0d1a;
  }

  /* Override leaflet dark theme */
  .leaflet-tile-pane { filter: brightness(0.85) saturate(0.7) hue-rotate(200deg); }
  .leaflet-control-attribution { display: none !important; }
  .leaflet-control-zoom { display: none !important; }

  /* TOP BAR */
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 12px 16px;
    background: linear-gradient(to bottom, rgba(10,10,15,0.97) 0%, transparent 100%);
  }

  #search-box {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  #destination-input {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid rgba(0,229,255,0.3);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s;
  }

  #destination-input::placeholder { color: var(--muted); font-weight: 400; }
  #destination-input:focus { border-color: var(--accent); }

  #btn-go {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  #btn-go:active { transform: scale(0.95); opacity: 0.85; }

  /* AUTOCOMPLETE DROPDOWN */
  #autocomplete-list {
    position: absolute;
    top: 60px; left: 16px; right: 16px;
    background: var(--surface);
    border: 1.5px solid rgba(0,229,255,0.25);
    border-radius: 12px;
    z-index: 1001;
    overflow: hidden;
    display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    max-height: 220px;
    overflow-y: auto;
  }

  .ac-item {
    padding: 12px 16px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:active, .ac-item:hover { background: var(--surface2); }
  .ac-icon { color: var(--accent); font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .ac-main { font-weight: 600; color: var(--accent); font-size: 13px; }
  .ac-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* INSTRUCTION BANNER */
  #instruction-banner {
    position: absolute;
    top: 76px; left: 16px; right: 16px;
    z-index: 1000;
    background: var(--surface);
    border: 1.5px solid rgba(0,229,255,0.2);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(10px);
    animation: slideDown 0.3s ease;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #turn-icon {
    width: 44px;
    height: 44px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    color: #000;
  }

  #turn-text {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
  }

  #turn-dist {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
  }

  /* BOTTOM PANEL */
  #bottom-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 16px;
    background: linear-gradient(to top, rgba(10,10,15,0.98) 60%, transparent 100%);
  }

  #status-card {
    background: var(--surface);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    padding: 16px;
    display: none;
  }

  #status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .stat-block { text-align: center; }
  .stat-val {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  #progress-bar {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    width: 0%;
    transition: width 0.5s ease;
  }

  #btn-stop {
    width: 100%;
    background: rgba(255,51,85,0.15);
    color: var(--danger);
    border: 1.5px solid rgba(255,51,85,0.4);
    border-radius: 10px;
    padding: 11px;
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  #btn-stop:active { opacity: 0.7; }

  #start-row {
    display: flex;
    gap: 10px;
    padding-bottom: 4px;
  }

  #btn-navigate {
    flex: 1;
    background: var(--accent2);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  #btn-navigate:active { transform: scale(0.97); }

  #btn-locate {
    position: absolute;
    bottom: 24px;
    left: 16px;
    z-index: 1001;
    background: var(--surface);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #btn-locate:active { opacity: 0.7; }

  #btn-test-watch {
    position: absolute;
    bottom: 24px;
    right: 16px;
    z-index: 1002;
    background: var(--surface);
    border: 1.5px solid rgba(0,229,255,0.3);
    border-radius: 14px;
    padding: 12px 14px;
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #btn-test-watch:active { opacity: 0.7; }

  /* TOAST */
  #toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 20px;
    padding: 20px 28px;
    text-align: center;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    min-width: 220px;
    box-shadow: 0 0 40px rgba(0,229,255,0.3);
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  #toast-icon { font-size: 36px; margin-bottom: 8px; }
  #toast-msg { font-size: 16px; font-weight: 700; color: var(--text); }
  #toast-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* LOGO */
  #logo {
    position: absolute;
    top: 76px;
    left: 16px;
    z-index: 5;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* NOTIF BAR */
  #notif-bar {
    background: rgba(255,204,0,0.15);
    border-bottom: 1px solid rgba(255,204,0,0.3);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--warning);
    font-weight: 600;
  }
  #btn-allow-notif {
    margin-left: auto;
    background: var(--warning);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .hidden { display: none !important; }

  /* Loading spinner */
  #loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1500;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(0,229,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { font-size: 13px; color: var(--muted); font-family: 'Space Mono', monospace; }
</style>
</head>
<body>

<div id="notif-bar">
  <span>⚠️ Cần quyền thông báo để đẩy lên đồng hồ</span>
  <button id="btn-allow-notif" onclick="requestNotifPermission()">Bật</button>
</div>

<div id="map"></div>
<div id="logo">KD Maps</div>

<div id="topbar">
  <div id="search-box">
    <input id="destination-input" type="text" placeholder="🔍 Nhập điểm đến..." autocomplete="off">
    <button id="btn-go" onclick="searchRoute()">Đi</button>
  </div>
  <div id="autocomplete-list"></div>
</div>

<div id="instruction-banner">
  <div id="turn-icon">⬆</div>
  <div style="flex:1">
    <div id="turn-text">Đang tính toán...</div>
    <div id="turn-dist"></div>
  </div>
</div>

<button id="btn-locate" onclick="goToMyLocation()">📍</button>
<button id="btn-test-watch" onclick="testWatchNotif()" title="Test đồng hồ">⌚</button>

<div id="bottom-panel">
  <div id="start-row">
    <button id="btn-navigate" onclick="startNavigation()">🧭 Bắt đầu dẫn đường</button>
  </div>
  <div id="status-card">
    <div id="status-row">
      <div class="stat-block">
        <div class="stat-val" id="stat-dist">--</div>
        <div class="stat-label">Còn lại</div>
      </div>
      <div class="stat-block">
        <div class="stat-val" id="stat-time">--</div>
        <div class="stat-label">Thời gian</div>
      </div>
      <div class="stat-block">
        <div class="stat-val" id="stat-speed">--</div>
        <div class="stat-label">km/h</div>
      </div>
    </div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <button id="btn-stop" onclick="stopNavigation()">■ Dừng dẫn đường</button>
  </div>
</div>

<div id="toast">
  <div id="toast-icon">🗺️</div>
  <div id="toast-msg"></div>
  <div id="toast-sub"></div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">Đang tìm đường...</div>
</div>

<script>
// ── SERVICE WORKER (inline Blob) ─────────────────────────────
let swReg = null;

const swCode = `
self.addEventListener('notificationclick', e => e.notification.close());
`;

async function initServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    swReg = await navigator.serviceWorker.register(swUrl, { scope: '/' });
    console.log('SW registered', swReg);
  } catch(e) {
    console.warn('SW register failed:', e);
  }
}

async function showSystemNotification(title, body) {
  const tag = 'kdmaps-' + Date.now();
  const opts = {
    body,
    icon: 'https://cdn-icons-png.flaticon.com/512/854/854878.png',
    badge: 'https://cdn-icons-png.flaticon.com/512/854/854878.png',
    tag,
    renotify: true,
    vibrate: [200, 100, 200],
    silent: false,
    requireInteraction: false
  };
  // SW.showNotification() = system notification bar = đồng hồ nhận được
  if (swReg && swReg.active) {
    try {
      await swReg.showNotification(title, opts);
      return;
    } catch(e) { console.warn('SW notif fail:', e); }
  }
  // Fallback nếu SW chưa active
  try {
    const n = new Notification(title, opts);
    setTimeout(() => n.close(), 8000);
  } catch(e) {}
}

// ── STATE ────────────────────────────────────────────────────
let map, userMarker, routeLayer, destMarker;
let currentPosition = null;
let watchId = null;
let routeSteps = [];
let currentStepIndex = 0;
let isNavigating = false;
let totalDistance = 0;
let totalDuration = 0;
let lastNotifStep = -1;
let notifGranted = false;
let acTimeout = null;

// ── MAP INIT + NOTIFICATION (sau khi Leaflet load) ───────────
window.addEventListener('load', () => {
  initServiceWorker();
  map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
    center: [10.8231, 106.6297],
    zoom: 15
  });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: ''
  }).addTo(map);
  if (!('Notification' in window)) {
    document.getElementById('notif-bar').classList.add('hidden');
    return;
  }
  if (Notification.permission === 'granted') {
    notifGranted = true;
    document.getElementById('btn-allow-notif').classList.add('hidden');
    document.getElementById('btn-test-watch').style.display = 'flex';
    document.getElementById('notif-bar').classList.add('hidden');
  } else if (Notification.permission === 'denied') {
    document.getElementById('notif-bar').querySelector('span').textContent = '🔕 Thông báo bị chặn — vào Settings để bật';
    document.getElementById('btn-allow-notif').classList.add('hidden');
  }
  goToMyLocation();
});

function requestNotifPermission() {
  Notification.requestPermission().then(perm => {
    if (perm === 'granted') {
      notifGranted = true;
      // Hiện nút Test thay vì ẩn bar
      document.getElementById('btn-allow-notif').classList.add('hidden');
      document.getElementById('notif-bar').classList.add('hidden');
      document.getElementById('btn-test-watch').style.display = 'flex';
      showToast('✅', 'Đã bật thông báo!', 'Nhấn ⌚ góc dưới phải để test đồng hồ');
    } else {
      document.getElementById('notif-bar').querySelector('span').textContent = '🔕 Cần bật thông báo trong Settings';
    }
  });
}

async function testWatchNotif() {
  if (!notifGranted) { showToast('⚠️', 'Chưa bật thông báo', ''); return; }
  // Chờ SW active nếu chưa sẵn sàng
  if (swReg && !swReg.active) {
    showToast('⏳', 'Đang khởi động SW...', 'Thử lại sau 2 giây');
    await new Promise(r => setTimeout(r, 2000));
  }
  await showSystemNotification('⬆ KD Maps', 'Đi thẳng 200m rồi rẽ trái vào Lê Lợi');
  setTimeout(() => showSystemNotification('↰ Rẽ trái', 'Vào đường Nguyễn Huệ · còn 80m'), 3000);
  showToast('⌚', 'Đã gửi test!', 'Kéo thanh thông báo xuống xem');
}

// ── LOCATION ─────────────────────────────────────────────────
function goToMyLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    map.setView([currentPosition.lat, currentPosition.lng], 16);
    updateUserMarker(currentPosition);
  }, () => {
    showToast('⚠️', 'Không lấy được vị trí', 'Hãy bật GPS');
  });
}

function updateUserMarker(pos) {
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.circleMarker([pos.lat, pos.lng], {
    radius: 10,
    fillColor: '#00e5ff',
    color: '#fff',
    weight: 3,
    opacity: 1,
    fillOpacity: 1
  }).addTo(map);
}

// ── AUTOCOMPLETE (Nominatim) ─────────────────────────────────
const destInput = document.getElementById('destination-input');
const acList = document.getElementById('autocomplete-list');

destInput.addEventListener('input', () => {
  clearTimeout(acTimeout);
  const q = destInput.value.trim();
  if (q.length < 3) { acList.style.display = 'none'; return; }
  acTimeout = setTimeout(() => fetchSuggestions(q), 400);
});

destInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { acList.style.display = 'none'; searchRoute(); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#topbar')) acList.style.display = 'none';
});

async function fetchSuggestions(q) {
  try {
    const bias = currentPosition ? `&viewbox=${currentPosition.lng-0.5},${currentPosition.lat+0.5},${currentPosition.lng+0.5},${currentPosition.lat-0.5}&bounded=0` : '';
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&addressdetails=1&limit=5&countrycodes=vn${bias}`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'vi' } });
    const data = await res.json();
    renderSuggestions(data);
  } catch(e) { /* silent fail */ }
}

function renderSuggestions(items) {
  if (!items.length) { acList.style.display = 'none'; return; }
  acList.innerHTML = items.map(item => {
    const parts = item.display_name.split(', ');
    const main = parts[0];
    const sub = parts.slice(1, 3).join(', ');
    return `<div class="ac-item" onclick="selectPlace(${item.lat}, ${item.lon}, '${escHtml(item.display_name)}')">
      <span class="ac-icon">📍</span>
      <div><div class="ac-main">${escHtml(main)}</div><div class="ac-sub">${escHtml(sub)}</div></div>
    </div>`;
  }).join('');
  acList.style.display = 'block';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

let selectedDest = null;

function selectPlace(lat, lon, name) {
  selectedDest = { lat: parseFloat(lat), lng: parseFloat(lon), name };
  destInput.value = name.split(',')[0];
  acList.style.display = 'none';
}

// ── ROUTING (OSRM) ────────────────────────────────────────────
async function searchRoute() {
  acList.style.display = 'none';

  let dest = selectedDest;

  // If no autocomplete selection, geocode the typed text
  if (!dest) {
    const q = destInput.value.trim();
    if (!q) return;
    showLoading('Đang tìm địa chỉ...');
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=vn`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'vi' } });
      const data = await res.json();
      if (!data.length) { hideLoading(); showToast('❌', 'Không tìm thấy địa chỉ', 'Thử nhập khác'); return; }
      dest = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), name: data[0].display_name };
    } catch(e) { hideLoading(); showToast('❌', 'Lỗi kết nối', ''); return; }
  }

  if (!currentPosition) {
    showToast('📍', 'Chưa có vị trí', 'Hãy bật GPS');
    return;
  }

  showLoading('Đang tính đường...');

  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${currentPosition.lng},${currentPosition.lat};${dest.lng},${dest.lat}?steps=true&geometries=geojson&overview=full&annotations=false`;
    const res = await fetch(url);
    const data = await res.json();
    hideLoading();

    if (data.code !== 'Ok' || !data.routes.length) {
      showToast('❌', 'Không tìm được đường', 'Thử địa chỉ khác'); return;
    }

    const route = data.routes[0];
    const leg = route.legs[0];

    // Draw route
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.geoJSON(route.geometry, {
      style: { color: '#00e5ff', weight: 5, opacity: 0.9 }
    }).addTo(map);

    // Dest marker
    if (destMarker) map.removeLayer(destMarker);
    destMarker = L.circleMarker([dest.lat, dest.lng], {
      radius: 9, fillColor: '#ff6b35', color: '#fff', weight: 3, opacity: 1, fillOpacity: 1
    }).addTo(map);

    // Parse steps
    routeSteps = leg.steps.map(s => ({
      instruction: s.maneuver.instruction || getManeuverText(s.maneuver),
      distance: s.distance,
      duration: s.duration,
      maneuver: s.maneuver.type,
      modifier: s.maneuver.modifier || '',
      endLat: s.maneuver.location[1],
      endLng: s.maneuver.location[0]
    }));

    totalDistance = route.distance;
    totalDuration = route.duration;

    // Fit bounds
    map.fitBounds(routeLayer.getBounds(), { padding: [60, 60] });

    // Show navigate btn
    const nb = document.getElementById('btn-navigate');
    nb.style.display = 'flex';

    const distText = formatDist(route.distance);
    const timeText = formatTime(route.duration);
    showToast('🗺️', distText + ' · ' + timeText, dest.name.substring(0, 40));

    selectedDest = dest;

  } catch(e) {
    hideLoading();
    showToast('❌', 'Lỗi kết nối', 'Kiểm tra mạng');
  }
}

function getManeuverText(maneuver) {
  const t = maneuver.type, m = maneuver.modifier || '';
  const map = {
    'turn': { 'left': 'Rẽ trái', 'right': 'Rẽ phải', 'slight left': 'Rẽ nhẹ trái', 'slight right': 'Rẽ nhẹ phải', 'sharp left': 'Rẽ gấp trái', 'sharp right': 'Rẽ gấp phải', 'uturn': 'Quay đầu' },
    'new name': { '': 'Tiếp tục thẳng' },
    'depart': { '': 'Bắt đầu' },
    'arrive': { '': 'Đã đến nơi!' },
    'merge': { 'left': 'Nhập làn trái', 'right': 'Nhập làn phải' },
    'roundabout': { '': 'Vào vòng xuyến' },
    'exit roundabout': { '': 'Ra khỏi vòng xuyến' },
    'fork': { 'left': 'Rẽ trái ở ngã rẽ', 'right': 'Rẽ phải ở ngã rẽ' },
  };
  return (map[t] && (map[t][m] || map[t][''])) || 'Tiếp tục';
}

// ── NAVIGATION ────────────────────────────────────────────────
function startNavigation() {
  if (!routeSteps.length) return;
  isNavigating = true;
  currentStepIndex = 0;
  lastNotifStep = -1;

  document.getElementById('btn-navigate').style.display = 'none';
  document.getElementById('status-card').style.display = 'block';
  document.getElementById('instruction-banner').style.display = 'flex';

  map.setZoom(17);

  watchId = navigator.geolocation.watchPosition(
    onPositionUpdate,
    err => console.warn('GPS', err),
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
  );

  updateInstruction();
  showToast('🧭', 'Bắt đầu dẫn đường!', 'Chúc đi đường vui vẻ');
}

function stopNavigation() {
  isNavigating = false;
  if (watchId) navigator.geolocation.clearWatch(watchId);
  document.getElementById('status-card').style.display = 'none';
  document.getElementById('instruction-banner').style.display = 'none';
  document.getElementById('btn-navigate').style.display = 'none';
  showToast('🏁', 'Đã dừng dẫn đường', '');
}

function onPositionUpdate(pos) {
  if (!isNavigating) return;
  currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
  const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : '--';
  updateUserMarker(currentPosition);
  map.panTo([currentPosition.lat, currentPosition.lng]);
  document.getElementById('stat-speed').textContent = speed === '--' ? '--' : speed;
  checkStepProximity();
}

function checkStepProximity() {
  if (currentStepIndex >= routeSteps.length) { arriveDestination(); return; }
  const step = routeSteps[currentStepIndex];
  const dist = getDistance(currentPosition, { lat: step.endLat, lng: step.endLng });
  updateStats(dist);
  updateInstruction(dist);

  if (dist < 300 && lastNotifStep !== currentStepIndex * 10 + 3) {
    lastNotifStep = currentStepIndex * 10 + 3;
    sendNotification('🔔 Sắp đến ngã rẽ', step.instruction + ' · còn ' + formatDist(dist));
  } else if (dist < 100 && lastNotifStep !== currentStepIndex * 10 + 1) {
    lastNotifStep = currentStepIndex * 10 + 1;
    sendNotification('⚡ ' + step.instruction, 'Rẽ ngay bây giờ!');
  }

  if (dist < 30) {
    currentStepIndex++;
    lastNotifStep = -1;
  }
}

function updateInstruction(distToStep) {
  if (currentStepIndex >= routeSteps.length) return;
  const step = routeSteps[currentStepIndex];
  document.getElementById('turn-icon').textContent = getTurnIcon(step.maneuver, step.modifier);
  document.getElementById('turn-text').textContent = step.instruction;
  document.getElementById('turn-dist').textContent = formatDist(distToStep != null ? distToStep : step.distance);
}

function updateStats(distToNextStep) {
  let remaining = distToNextStep;
  for (let i = currentStepIndex + 1; i < routeSteps.length; i++) remaining += routeSteps[i].distance;
  const progress = Math.min(((totalDistance - remaining) / totalDistance) * 100, 100);
  document.getElementById('progress-fill').style.width = progress + '%';
  document.getElementById('stat-dist').textContent = formatDist(remaining);
  const timeLeft = Math.round((remaining / totalDistance) * totalDuration);
  document.getElementById('stat-time').textContent = formatTime(timeLeft);
}

function arriveDestination() {
  isNavigating = false;
  if (watchId) navigator.geolocation.clearWatch(watchId);
  document.getElementById('status-card').style.display = 'none';
  document.getElementById('instruction-banner').style.display = 'none';
  document.getElementById('progress-fill').style.width = '100%';
  sendNotification('🏁 Đã đến nơi!', 'Bạn đã đến điểm đến');
  showToast('🏁', 'Đã đến nơi!', 'Chúc mừng!');
}

// ── HELPERS ───────────────────────────────────────────────────
let notifCounter = 0;

function sendNotification(title, body) {
  showToast('🔔', title, body);
  if (!notifGranted) return;
  notifCounter++;
  showSystemNotification(title, body);
}

function showToast(icon, msg, sub) {
  const t = document.getElementById('toast');
  document.getElementById('toast-icon').textContent = icon;
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-sub').textContent = sub || '';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function showLoading(text) {
  document.getElementById('loading-text').textContent = text;
  document.getElementById('loading').style.display = 'flex';
}
function hideLoading() {
  document.getElementById('loading').style.display = 'none';
}

function getDistance(a, b) {
  const R = 6371000;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function formatDist(m) {
  if (m >= 1000) return (m/1000).toFixed(1) + ' km';
  return Math.round(m) + ' m';
}

function formatTime(s) {
  if (s >= 3600) return Math.round(s/3600) + ' giờ';
  if (s >= 60) return Math.round(s/60) + ' phút';
  return s + ' giây';
}

function getTurnIcon(type, modifier) {
  if (type === 'arrive') return '🏁';
  if (type === 'roundabout' || type === 'exit roundabout') return '🔄';
  if (modifier === 'left' || modifier === 'sharp left') return '↰';
  if (modifier === 'right' || modifier === 'sharp right') return '↱';
  if (modifier === 'slight left') return '↖';
  if (modifier === 'slight right') return '↗';
  if (modifier === 'uturn') return '↩';
  return '⬆';
}
