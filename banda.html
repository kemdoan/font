<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; height:100vh; }
#w { position:relative; width:100%; cursor:ew-resize; user-select:none; touch-action:none; }
#w img { -webkit-user-drag:none; pointer-events:none; display:block; width:100%; }
#ib { position:absolute; inset:0; height:100%; object-fit:cover; clip-path:inset(0 50% 0 0); }
#dv { position:absolute; top:0; bottom:0; left:50%; width:2px; background:rgba(255,255,255,.85); transform:translateX(-50%); pointer-events:none; }
#hd { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:42px; height:42px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.4); }
.lb { position:absolute; bottom:12px; background:rgba(0,0,0,.55); color:#fff; font-size:13px; font-weight:500; padding:4px 10px; border-radius:4px; pointer-events:none; font-family:sans-serif; }
</style>
</head>
<body>
<div id="w">
  <img id="ia" src="https://kemdoan.github.io/font/images/kdgoken.jpg"  draggable="false">
  <img id="ib" src="https://kemdoan.github.io/font/images/kdnetsera.jpg" draggable="false">
  <div id="dv">
    <div id="hd">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
        <path d="M7 11H3M7 11L4.5 8.5M7 11L4.5 13.5"       stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 11H19M15 11L17.5 8.5M15 11L17.5 13.5" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
  <div class="lb" style="left:12px">Before</div>
  <div class="lb" style="right:12px">After</div>
</div>
<script>
let p=50,drag=false;
const w=document.getElementById('w'),dv=document.getElementById('dv'),ib=document.getElementById('ib');
function sp(v){p=Math.max(0,Math.min(100,v));ib.style.clipPath='inset(0 '+(100-p)+'% 0 0)';dv.style.left=p+'%';}
function gp(e){const r=w.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX;return(cx-r.left)/r.width*100;}
w.addEventListener('mousedown',e=>{e.preventDefault();drag=true;sp(gp(e));});
window.addEventListener('mousemove',e=>{if(drag){e.preventDefault();sp(gp(e));}});
window.addEventListener('mouseup',()=>drag=false);
w.addEventListener('touchstart',e=>{e.preventDefault();drag=true;sp(gp(e));},{passive:false});
w.addEventListener('touchmove',e=>{e.preventDefault();sp(gp(e));},{passive:false});
w.addEventListener('touchend',()=>drag=false);
window.addEventListener('resize',()=>sp(p));
</script>
</body>
</html>
